name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: argus-test
          MINIO_ROOT_PASSWORD: argus-test-secret
          MINIO_DEFAULT_BUCKETS: argus-test
        ports: ["9000:9000"]
    env:
      ARGUS_TEST_POSTGRES_DSN: postgres://argus:argus@localhost:5432/argus?sslmode=disable
      ARGUS_TEST_S3_ENDPOINT: http://localhost:9000
      ARGUS_TEST_S3_BUCKET: argus-test
      AWS_ACCESS_KEY_ID: argus-test
      AWS_SECRET_ACCESS_KEY: argus-test-secret
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: wait for minio
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "minio did not become healthy" >&2
          exit 1
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: go test
        run: go test -race ./...

  sdk-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - run: go test -race ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: go test -race ./...

  testapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: testapp/go.mod
      - run: go test -race ./...

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: check generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

  sdk-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci
      - run: npm test
