# Argus agent as a DaemonSet: one pod per node tails /var/log/pods, so every
# workload that starts on the cluster shows up in Argus as a service.
#
#   kubectl create namespace argus
#   kubectl -n argus create secret generic argus-agent --from-literal=api-key=argus_xxx
#   kubectl apply -f daemonset.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-agent
  namespace: argus
---
# Only used when restart actions are enabled (ARGUS_ACTIONS_ENABLED below). The
# ClusterRole grants nothing by itself: bind it with a RoleBinding in each
# namespace the agent may restart things in, and list the same namespaces in
# ARGUS_ACTION_NAMESPACES. See the commented example at the end of this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-agent-restart
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, delete] # delete only for pods with no owner
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, patch] # patch = rolling restart
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: argus-agent
  namespace: argus
spec:
  selector:
    matchLabels: { app: argus-agent }
  template:
    metadata:
      labels: { app: argus-agent }
    spec:
      serviceAccountName: argus-agent
      tolerations:
        - operator: Exists # also run on tainted nodes
      containers:
        - name: agent
          image: argus-agent:latest # build with agent/Dockerfile and push to your registry
          env:
            - name: ARGUS_URL
              value: http://argus.argus.svc:8080
            - name: ARGUS_API_KEY
              valueFrom:
                secretKeyRef: { name: argus-agent, key: api-key }
            - name: ARGUS_AGENT_MODE
              value: kubernetes
            - name: ARGUS_STATE_DIR
              value: /state
            - name: ARGUS_LABELS
              value: cluster=dev # extra labels added to every stream
            - name: ARGUS_EXCLUDE_NAMESPACES
              value: argus # do not ship the agent's own logs
            # Let Argus admins restart workloads. Off unless enabled AND a namespace is listed.
            # - { name: ARGUS_ACTIONS_ENABLED, value: "true" }
            # - { name: ARGUS_ACTION_NAMESPACES, value: prod }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
            - { name: state, mountPath: /state }
      volumes:
        - name: pods
          hostPath: { path: /var/log/pods }
        - name: state
          hostPath: { path: /var/lib/argus-agent, type: DirectoryOrCreate }
# --- optional: allow restarts in one namespace (repeat per namespace) ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: argus-agent-restart
#   namespace: prod
# roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: argus-agent-restart }
# subjects:
#   - { kind: ServiceAccount, name: argus-agent, namespace: argus }
