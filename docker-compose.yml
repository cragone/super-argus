# Local-dev-only services for exercising Postgres and S3-compatible storage.
# Matches the image tags used by .github/workflows/ci.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnami/minio:latest
    environment:
      MINIO_ROOT_USER: argus-test
      MINIO_ROOT_PASSWORD: argus-test-secret
      MINIO_DEFAULT_BUCKETS: argus-test
    ports:
      - "9000:9000"
      - "9001:9001"
