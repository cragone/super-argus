openapi: 3.0.3
info:
  title: Argus API
  version: 0.4.0
  description: |
    Argus log server. UI routes use a JWT bearer token (`/auth/login`); ingest uses an API key (`X-Argus-Key`).
    This spec is served by the server at `/api/v1/openapi.yaml`; the client types in `app/` are generated from it.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      summary: Exchange email and password for tokens
      description: Also sets an HttpOnly `argus_refresh` cookie (used by the web client).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a refresh token for a new token pair
      description: The refresh token comes from the body, or from the `argus_refresh` cookie when the body is empty.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      summary: Clear the refresh cookie
      security: []
      responses:
        '204': { description: Logged out }
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
  /api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys (admin)
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createApiKey
      summary: Create an API key (admin). The plaintext key is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKeyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedApiKey' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }
  /ingest/push:
    post:
      operationId: ingestPush
      summary: Push NDJSON log lines
      security: [ { apiKey: [] } ]
      parameters:
        - { name: X-Argus-Labels, in: header, required: false, schema: { type: string }, description: 'Default labels for the batch: k=v,k2=v2' }
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string, description: 'One JSON object per line: {"ts","labels","line"}' }
      responses:
        '200':
          description: Accepted (possibly with some rejected lines)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /ingest/loki:
    post:
      operationId: ingestLoki
      summary: Loki-compatible push
      description: >
        Accepts the Loki push API in JSON ({"streams":[{"stream":{...},"values":[["<unix ns>","line"]]}]})
        or snappy-compressed protobuf (Content-Type application/x-protobuf), so Promtail, Grafana Alloy,
        Fluent Bit or Vector can point at Argus. Also served at /loki/api/v1/push, outside /api/v1.
        Authenticate with the API key as X-Argus-Key, a bearer token, or the basic-auth password.
        Structured metadata is ignored; label names are rewritten to [a-zA-Z0-9_].
      security: [ { apiKey: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/x-protobuf:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Accepted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /ingest/liveness:
    post:
      operationId: ingestLiveness
      summary: Report per-service liveness (systemd/Kubernetes collectors)
      description: >
        Sent by the Argus agent's systemd or Kubernetes liveness collectors, distinct from log
        ingest: it says whether the unit/pod is actually running, not whether it has logged
        recently. Agents send a heartbeat on every poll, not only on change.
      security: [ { apiKey: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LivenessRequest' }
      responses:
        '200':
          description: Accepted (possibly with some rejected pings)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivenessResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /query/range:
    get:
      operationId: queryRange
      summary: Run a log query over a time range
      parameters:
        - { name: query, in: query, required: true, schema: { type: string }, description: ArgusQL log query }
        - { name: start, in: query, required: true, schema: { type: string }, description: RFC3339 or unix nanoseconds (inclusive) }
        - { name: end, in: query, required: true, schema: { type: string }, description: RFC3339 or unix nanoseconds (exclusive) }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000 } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [backward, forward], default: backward } }
      responses:
        '200':
          description: Matching entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RangeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /tail:
    get:
      operationId: tailStream
      summary: Live tail (server-sent events)
      description: |
        Streams matching lines as they are ingested. Events: `ready`, `entry` (JSON: ts, stream, labels, line, fields),
        `dropped` (`{"count":N}`: the client was too slow), `expired` (access token ended; reconnect with a new one).
        Lines starting with `:` are heartbeats. Each user may hold only a few streams open (429 otherwise).
      parameters:
        - { name: query, in: query, required: true, schema: { type: string }, description: ArgusQL log query (stream selector required) }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /query/metric:
    get:
      operationId: queryMetric
      summary: Run a metric query (range aggregation) over a time range
      description: |
        count_over_time, rate and bytes_over_time, optionally wrapped in sum [by (...)] and topk(n, ...).
        Start and end are aligned down to the step, and identical requests are cached for one step.
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: start, in: query, required: true, schema: { type: string }, description: RFC3339 or unix nanoseconds }
        - { name: end, in: query, required: true, schema: { type: string }, description: RFC3339 or unix nanoseconds }
        - { name: step, in: query, required: false, schema: { type: string }, description: Duration like 30s or seconds; default picks about 250 points }
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /saved-queries:
    get:
      operationId: listSavedQueries
      summary: Saved queries
      responses:
        '200':
          description: Queries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SavedQuery' } }
    post:
      operationId: createSavedQuery
      summary: Save a query (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedQueryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedQuery' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /saved-queries/{id}:
    put:
      operationId: updateSavedQuery
      summary: Update a saved query (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedQueryInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedQuery' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSavedQuery
      summary: Delete a saved query (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /dashboards:
    get:
      operationId: listDashboards
      summary: Dashboards (without panels)
      responses:
        '200':
          description: Dashboards
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Dashboard' } }
    post:
      operationId: createDashboard
      summary: Create a dashboard (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/Error' }
  /dashboards/{id}:
    get:
      operationId: getDashboard
      summary: A dashboard with its panels
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateDashboard
      summary: Update title, description and layout (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDashboard
      summary: Delete a dashboard and its panels (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /dashboards/{id}/panels:
    post:
      operationId: createPanel
      summary: Add a panel (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PanelInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Panel' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /dashboards/{id}/panels/{panelId}:
    put:
      operationId: updatePanel
      summary: Update a panel (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: panelId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PanelInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Panel' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deletePanel
      summary: Delete a panel (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: panelId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /labels:
    get:
      operationId: listLabels
      summary: Label names
      parameters:
        - { $ref: '#/components/parameters/Start' }
        - { $ref: '#/components/parameters/End' }
      responses:
        '200':
          description: Names
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StringList' }
  /labels/{name}/values:
    get:
      operationId: listLabelValues
      summary: Values of one label
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Start' }
        - { $ref: '#/components/parameters/End' }
      responses:
        '200':
          description: Values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StringList' }
  /services:
    get:
      operationId: listServices
      summary: Services (values of the service label) with activity and volume
      parameters:
        - { name: label, in: query, schema: { type: string, default: service } }
        - { $ref: '#/components/parameters/Start' }
        - { $ref: '#/components/parameters/End' }
      responses:
        '200':
          description: Services, active first then by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceList' }
  /openapi.yaml:
    get:
      operationId: getOpenApi
      summary: This document
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema: { type: string }
  /alert-rules:
    get:
      operationId: listAlertRules
      summary: Alert rules with their current state
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }
    post:
      operationId: createAlertRule
      summary: Create an alert rule (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /alert-rules/{id}:
    get:
      operationId: getAlertRule
      summary: One alert rule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateAlertRule
      summary: Update an alert rule (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAlertRule
      summary: Delete an alert rule and its history (editor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /alert-events:
    get:
      operationId: listAlertEvents
      summary: Alert state transitions, newest first
      parameters:
        - { name: rule_id, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AlertEvent' } }
        '400': { $ref: '#/components/responses/Error' }
  /channels:
    get:
      operationId: listChannels
      summary: Notification channels (editor; URLs are reduced to their host)
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Channel' } }
    post:
      operationId: createChannel
      summary: Create a notification channel (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /channels/{id}:
    put:
      operationId: updateChannel
      summary: Update a notification channel (admin; omit url or secret to keep them)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteChannel
      summary: Delete a notification channel (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /channels/{id}/test:
    post:
      operationId: testChannel
      summary: Send a sample notification (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Delivery result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
        '404': { $ref: '#/components/responses/Error' }
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKey: { type: apiKey, in: header, name: X-Argus-Key }
  parameters:
    Start: { name: start, in: query, required: false, schema: { type: string }, description: RFC3339 or unix nanoseconds }
    End: { name: end, in: query, required: false, schema: { type: string }, description: RFC3339 or unix nanoseconds }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      properties:
        refresh_token: { type: string }
    TokenResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token lifetime in seconds }
    Me:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [viewer, editor, admin] }
    ApiKey:
      type: object
      required: [id, name, key_prefix, label, rate_limit, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        key_prefix: { type: string }
        label: { type: string }
        rate_limit: { type: integer }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        label: { type: string }
        rate_limit: { type: integer }
        allowed_labels: { type: object, additionalProperties: true }
    CreatedApiKey:
      allOf:
        - { $ref: '#/components/schemas/ApiKey' }
        - type: object
          required: [key]
          properties:
            key: { type: string, description: 'Plaintext key, shown once' }
    PushResponse:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        sampled: { type: integer, description: Lines dropped by the server's sampling policy }
        errors: { type: array, items: { type: string } }
    LivenessPing:
      type: object
      required: [service, source, alive]
      properties:
        service: { type: string }
        source: { type: string, enum: [systemd, kubernetes] }
        alive: { type: boolean }
        detail: { type: string }
    LivenessRequest:
      type: object
      required: [pings]
      properties:
        pings: { type: array, items: { $ref: '#/components/schemas/LivenessPing' } }
    LivenessResponse:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        errors: { type: array, items: { type: string } }
    ServiceList:
      type: object
      required: [label, data]
      properties:
        label: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/Service' }
    Service:
      type: object
      required: [name, first_seen, last_seen, active, streams, lines, bytes]
      properties:
        name: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        active: { type: boolean, description: Seen within the last minute }
        streams: { type: integer }
        lines: { type: integer, format: int64, description: Flushed lines in the window }
        bytes: { type: integer, format: int64 }
        liveness_state:
          type: string
          enum: [alive, down, unknown]
          description: >
            From a systemd/Kubernetes collector, distinct from `active`'s log recency.
            Absent when no collector has reported for this service.
    StringList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { type: string } }
    QueryEntry:
      type: object
      required: [ts, stream, line]
      properties:
        ts: { type: string, description: Unix nanoseconds as a string }
        stream: { type: string, description: 'Key into `streams`' }
        line: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    QueryStats:
      type: object
      required: [lines_scanned, bytes_scanned, chunks_scanned, chunks_skipped, head_lines, streams, elapsed_ms]
      properties:
        lines_scanned: { type: integer }
        bytes_scanned: { type: integer }
        chunks_scanned: { type: integer }
        chunks_skipped: { type: integer }
        head_lines: { type: integer }
        streams: { type: integer }
        elapsed_ms: { type: integer }
    RangeResponse:
      type: object
      required: [entries, streams, stats]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/QueryEntry' } }
        streams:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
        stats: { $ref: '#/components/schemas/QueryStats' }
    MetricSeries:
      type: object
      required: [labels, values]
      properties:
        labels: { type: object, additionalProperties: { type: string } }
        values:
          type: array
          description: Pairs of [unix milliseconds, value]
          items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
    MetricResponse:
      type: object
      required: [series, start_ms, end_ms, step_ms, stats]
      properties:
        series: { type: array, items: { $ref: '#/components/schemas/MetricSeries' } }
        start_ms: { type: integer }
        end_ms: { type: integer }
        step_ms: { type: integer }
        stats: { $ref: '#/components/schemas/QueryStats' }
    SavedQueryInput:
      type: object
      required: [name, query]
      properties:
        name: { type: string }
        query: { type: string, description: A log query or a metric query }
        default_range: { type: string, description: Preset id such as 1h, default: 1h }
    SavedQuery:
      allOf:
        - { $ref: '#/components/schemas/SavedQueryInput' }
        - type: object
          required: [id, owner_id, default_range, created_at, updated_at]
          properties:
            id: { type: string }
            owner_id: { type: string }
            default_range: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PanelInput:
      type: object
      required: [title, type, query]
      properties:
        title: { type: string }
        type: { type: string, enum: [logs, timeseries, top_n, stat] }
        query: { type: string, description: A log query for logs panels and a metric query for the others }
        step: { type: string, description: Duration like 30s; empty means automatic }
        options: { type: object, additionalProperties: true }
        position: { type: integer }
    Panel:
      type: object
      required: [id, dashboard_id, title, type, query, step, options, position]
      properties:
        id: { type: string }
        dashboard_id: { type: string }
        title: { type: string }
        type: { type: string, enum: [logs, timeseries, top_n, stat] }
        query: { type: string }
        step: { type: string }
        options: { type: object, additionalProperties: true }
        position: { type: integer }
    DashboardInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        layout: { type: object, additionalProperties: true }
    Dashboard:
      type: object
      required: [id, owner_id, title, description, layout, panels, created_at, updated_at]
      properties:
        id: { type: string }
        owner_id: { type: string }
        title: { type: string }
        description: { type: string }
        layout: { type: object, additionalProperties: true }
        panels: { type: array, items: { $ref: '#/components/schemas/Panel' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChannelInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string, enum: [webhook, email, sms], default: webhook }
        url: { type: string, description: For type webhook, an http(s) URL; required on create }
        smtp_host: { type: string, description: For type email, the SMTP server host; required on create }
        smtp_port: { type: integer, description: For type email, the SMTP server port; required on create }
        username: { type: string, description: For type email, the SMTP username (optional) }
        account_sid: { type: string, description: For type sms, the Twilio Account SID; required on create }
        from: { type: string, description: For type email or sms, the sender address or phone number; required on create }
        to:
          type: array
          items: { type: string }
          description: For type email or sms, the recipient addresses or phone numbers; required on create
        secret: { type: string, description: The one secret this channel type needs (webhook signing secret, SMTP password, or Twilio auth token); omit to keep, empty to clear }
    Channel:
      type: object
      required: [id, name, type, has_secret, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [webhook, email, sms] }
        url_host: { type: string, description: Present for type webhook }
        smtp_host: { type: string, description: Present for type email }
        account_sid: { type: string, description: Present for type sms, masked after the first 4 characters }
        from: { type: string, description: Present for type email or sms }
        to:
          type: array
          items: { type: string }
          description: Present for type email or sms
        has_secret: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertRuleInput:
      type: object
      required: [name, query, comparator, threshold]
      properties:
        name: { type: string }
        query: { type: string, description: A metric query }
        comparator: { type: string, enum: [gt, gte, lt, lte, eq] }
        threshold: { type: number }
        window: { type: string, description: 'Evaluation lookback, 15s to 1h', default: 5m }
        for_duration: { type: string, description: 'Breach must persist this long before firing, up to 24h', default: 0s }
        cooldown: { type: string, description: 'Minimum time between firing notifications, up to 7d', default: 0s }
        severity: { type: string, enum: [info, warning, critical], default: warning }
        enabled: { type: boolean, default: true }
        notify_channel_ids: { type: array, items: { type: string } }
    AlertState:
      type: object
      required: [state, since, last_eval, last_value, last_error]
      properties:
        state: { type: string, enum: [ok, pending, firing] }
        since: { type: string, format: date-time }
        last_eval: { type: string, format: date-time, nullable: true }
        last_value: { type: number }
        last_error: { type: string }
    AlertRule:
      type: object
      required: [id, owner_id, name, query, comparator, threshold, window, for_duration, cooldown, severity, enabled, notify_channel_ids, state, created_at, updated_at]
      properties:
        id: { type: string }
        owner_id: { type: string }
        name: { type: string }
        query: { type: string }
        comparator: { type: string, enum: [gt, gte, lt, lte, eq] }
        threshold: { type: number }
        window: { type: string }
        for_duration: { type: string }
        cooldown: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        enabled: { type: boolean }
        notify_channel_ids: { type: array, items: { type: string } }
        state: { $ref: '#/components/schemas/AlertState' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertEvent:
      type: object
      required: [id, rule_id, rule_name, state, value, at, notified, notify_error]
      properties:
        id: { type: string }
        rule_id: { type: string }
        rule_name: { type: string }
        state: { type: string, enum: [pending, firing, resolved] }
        value: { type: number }
        at: { type: string, format: date-time }
        notified: { type: boolean }
        notify_error: { type: string }
